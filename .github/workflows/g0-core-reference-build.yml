name: G0 pinned Core reference build (no parity claim)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-reference-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout miner
        uses: actions/checkout@v4
        with:
          path: miner
          persist-credentials: false
      - name: Checkout pinned PEPEPOW Core
        uses: actions/checkout@v4
        with:
          repository: edisontw/PePe-core
          ref: c1394e652045a8abef3cb54f87eafec0844d3b1f
          path: core
          persist-credentials: false
      # Ubuntu 24.04 does not provide libopenlibm-dev in the runner apt sources.
      # Build an explicitly pinned upstream dependency instead of using system libm.
      # Link directly from the build tree: upstream CMake install tries /pkgconfig.
      - name: Checkout pinned OpenLibm
        uses: actions/checkout@v4
        with:
          repository: JuliaMath/openlibm
          ref: 5fe399749f9276eaa0b8403e507470da05cbbb3f
          path: openlibm
          persist-credentials: false
      - name: Build pinned OpenLibm locally
        run: |
          test "$(git -C openlibm rev-parse HEAD)" = 5fe399749f9276eaa0b8403e507470da05cbbb3f
          cmake -S openlibm -B openlibm-build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/openlibm"
          cmake --build openlibm-build --parallel 2
          test -f openlibm-build/libopenlibm.a
          test -f openlibm/include/openlibm_math.h
      - name: Configure real Core reference (synthetic disabled)
        run: |
          cmake -S miner -B build -DCMAKE_BUILD_TYPE=Release \
            -DHARNESS_CONTRACT_TESTS_ONLY=OFF \
            -DOPENLIBM_INCLUDE_DIR="$GITHUB_WORKSPACE/openlibm/include" \
            -DOPENLIBM_LIBRARY="$GITHUB_WORKSPACE/openlibm-build/libopenlibm.a" \
            -DPEPEPOW_CORE_SOURCE_DIR="$GITHUB_WORKSPACE/core" \
            -DPEPEPOW_CORE_EXPECTED_SHA=c1394e652045a8abef3cb54f87eafec0844d3b1f
      - name: Build and link real Core reference
        run: cmake --build build --config Release --parallel 2
      - name: Check reference executable exists without invoking hashing
        run: test -x build/pepepow-kat
      - name: Execute real reference binary and verify invalid-input exit codes
        shell: bash
        run: |
          set -euo pipefail
          # An executable existing is not proof that it starts or rejects bad input.
          set +e
          build/pepepow-kat >"$RUNNER_TEMP/kat-noargs.out" 2>&1
          noargs_status=$?
          build/pepepow-kat "$(printf '00%.0s' {1..79})" "$(printf '00%.0s' {1..32})" >"$RUNNER_TEMP/kat-short.out" 2>&1
          short_status=$?
          build/pepepow-kat "$(printf '00%.0s' {1..80})" "$(printf '00%.0s' {1..31})" >"$RUNNER_TEMP/kat-digest.out" 2>&1
          digest_status=$?
          set -e
          test "$noargs_status" -eq 2
          test "$short_status" -eq 2
          test "$digest_status" -eq 2
          echo "Pinned reference binary starts and rejects missing/short arguments (exit 2)."
          echo "No valid HooHash input was evaluated; digest parity remains untested."
      - name: Execute pinned Core HooHash on a valid 80-byte header (mismatch smoke only)
        shell: bash
        run: |
          set -euo pipefail
          # All-zero digest is deliberately NOT an independent golden vector.
          # This checks that a syntactically valid input reaches the real hash
          # function and that a mismatched full digest returns exit code 1.
          header="$(printf '00%.0s' {1..80})"
          wrong_digest="$(printf '00%.0s' {1..32})"
          set +e
          build/pepepow-kat "$header" "$wrong_digest" >"$RUNNER_TEMP/kat-smoke.out" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/kat-smoke.out"
          test "$status" -eq 1
          grep -Eq '^actual=[0-9a-f]{64}$' "$RUNNER_TEMP/kat-smoke.out"
          grep -Fxq 'MISMATCH' "$RUNNER_TEMP/kat-smoke.out"
          echo "Valid-header HooHash invocation and full-digest mismatch path passed."
          echo "This is NOT independent parity evidence and must not count toward G0 KATs."
      - name: Verify full-digest round-trip and final-byte rejection (same reference only)
        shell: bash
        run: |
          set -euo pipefail
          # This checks the real reference executable's output and comparator.
          # It is a SELF-CONSISTENCY test, not an independent golden KAT.
          header="$(printf '00%.0s' {1..80})"
          wrong="$(printf '00%.0s' {1..32})"
          set +e
          output="$(build/pepepow-kat "$header" "$wrong" 2>&1)"
          status=$?
          set -e
          test "$status" -eq 1
          actual="$(printf '%s\n' "$output" | grep -E '^actual=[0-9a-f]{64}
          test "${#actual}" -eq 64
          build/pepepow-kat "$header" "$actual" >"$RUNNER_TEMP/kat-roundtrip.out"
          grep -Fxq 'MATCH' "$RUNNER_TEMP/kat-roundtrip.out"
          last="${actual:62:2}"
          if [ "$last" = "00" ]; then replacement="01"; else replacement="00"; fi
          corrupted="${actual:0:62}$replacement"
          set +e
          build/pepepow-kat "$header" "$corrupted" >"$RUNNER_TEMP/kat-last-byte.out" 2>&1
          corrupt_status=$?
          set -e
          test "$corrupt_status" -eq 1
          grep -Fxq 'MISMATCH' "$RUNNER_TEMP/kat-last-byte.out"
          echo "Real Core output round-trip and last-byte mismatch rejection passed."
          echo "Expected digest came from the SAME binary: independent parity remains pending."
      - name: Evidence boundary
        run: |
          echo "Real pinned Core reference build/link succeeded."
          echo "No golden vectors, digest parity, GPU, Stratum, or pool submit tested."
 | cut -d= -f2)"
          test "${#actual}" -eq 64
          build/pepepow-kat "$header" "$actual" >"$RUNNER_TEMP/kat-roundtrip.out"
          grep -Fxq 'MATCH' "$RUNNER_TEMP/kat-roundtrip.out"
          last="${actual:62:2}"
          if [ "$last" = "00" ]; then replacement="01"; else replacement="00"; fi
          corrupted="${actual:0:62}$replacement"
          set +e
          build/pepepow-kat "$header" "$corrupted" >"$RUNNER_TEMP/kat-last-byte.out" 2>&1
          corrupt_status=$?
          set -e
          test "$corrupt_status" -eq 1
          grep -Fxq 'MISMATCH' "$RUNNER_TEMP/kat-last-byte.out"
          echo "Real Core output round-trip and last-byte mismatch rejection passed."
          echo "Expected digest came from the SAME binary: independent parity remains pending."
      - name: Evidence boundary
        run: |
          echo "Real pinned Core reference build/link succeeded."
          echo "No golden vectors, digest parity, GPU, Stratum, or pool submit tested."
